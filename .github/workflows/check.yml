name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        python: ['3.11', '3.14']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s tests -v
      - run: node --check market_observatory/static/app.js
      - run: node --test tests/browser_csv.test.cjs
      - run: python -m pip install .
      - run: market-observatory report --format json --output report.json
